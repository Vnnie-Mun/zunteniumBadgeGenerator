<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zuntenium Badge Generator</title>
    <meta name="description" content="Generate official Zuntenium contributor badges for Square, Story, and LinkedIn." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&family=Outfit:wght@500;700&family=Space+Grotesk:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="brand">
          <svg class="brand-mark" viewBox="0 0 64 64" role="img" aria-label="Zuntenium mark">
            <defs>
              <linearGradient id="goldMark" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#F3E2A8" />
                <stop offset="50%" stop-color="#D4AF37" />
                <stop offset="100%" stop-color="#8C6A1A" />
              </linearGradient>
            </defs>
            <circle cx="32" cy="32" r="30" fill="#050505" stroke="url(#goldMark)" stroke-width="2.2" />
            <circle cx="32" cy="32" r="24" fill="none" stroke="#D4AF37" stroke-opacity="0.35" stroke-width="1" />
            <ellipse cx="32" cy="32" rx="30" ry="11" fill="none" stroke="#F3E2A8" stroke-width="1.2" transform="rotate(-32 32 32)" />
            <circle cx="58" cy="21" r="2.4" fill="url(#goldMark)" />
            <path d="M19 22h26M45 22L19 42M19 42h26" fill="none" stroke="url(#goldMark)" stroke-width="5.2" />
          </svg>
          <div>
            <div class="brand-title">ZUNTENIUM</div>
            <div class="meta">Official Badge Generator</div>
          </div>
        </div>
        <div class="meta">Create your official contributor badge</div>
      </header>

      <div class="layout">
        <section class="panel" aria-label="Badge controls">
          <div class="section">
            <span class="section-title" id="roleLabel">Contributor role</span>
            <div id="roleGrid" class="chip-grid" role="group" aria-labelledby="roleLabel"></div>
          </div>

          <div class="section">
            <span class="section-title" id="photoLabel">Profile photo</span>
            <div
              id="dropzone"
              class="dropzone"
              role="button"
              tabindex="0"
              aria-labelledby="photoLabel"
              aria-describedby="photoHint"
            >
              <div style="font-size: 1.6rem; margin-bottom: 6px;">📤</div>
              <div>Drop a photo here or click to browse</div>
              <div class="meta" id="photoHint" style="margin-top: 4px;">PNG or JPG, up to 8MB</div>
            </div>
            <input id="fileInput" type="file" accept="image/png,image/jpeg,image/webp" class="sr-only" />
          </div>

          <div class="section">
            <span class="section-title">Your information</span>
            <div style="margin-bottom: 12px;">
              <label class="label" for="nameInput">Full name</label>
              <input id="nameInput" class="input" autocomplete="name" />
            </div>
            <div style="margin-bottom: 12px;">
              <label class="label" for="countryInput">Country</label>
              <input id="countryInput" class="input" autocomplete="country-name" />
            </div>
            <div style="margin-bottom: 12px;">
              <label class="label" for="orgInput">Organization</label>
              <input id="orgInput" class="input" />
            </div>
            <div>
              <label class="label" for="githubInput">GitHub username</label>
              <input id="githubInput" class="input" spellcheck="false" />
            </div>
          </div>

          <div class="section">
            <label class="section-title" for="quoteInput">Short quote</label>
            <textarea id="quoteInput" class="textarea" maxlength="180"></textarea>
          </div>

          <div class="section">
            <span class="section-title" id="layoutLabel">Format</span>
            <div class="chip-grid layout-options" role="group" aria-labelledby="layoutLabel">
              <button class="layout-chip" type="button" data-layout="square" aria-pressed="true">Square</button>
              <button class="layout-chip" type="button" data-layout="story" aria-pressed="false">Story</button>
              <button class="layout-chip" type="button" data-layout="linkedin" aria-pressed="false">LinkedIn</button>
            </div>
          </div>

          <div class="section">
            <div class="actions">
              <button id="downloadBtn" class="button" type="button" aria-label="Download badge as PNG">Download PNG</button>
              <button id="copyImageBtn" class="button secondary" type="button" aria-label="Copy badge image to clipboard">Copy image</button>
            </div>
            <div id="status" class="status" role="status" aria-live="polite"></div>
          </div>

          <div>
            <label class="section-title" for="captionInput">Suggested caption</label>
            <textarea id="captionInput" class="textarea"></textarea>
            <button id="copyBtn" class="button secondary" type="button" style="margin-top: 10px;" aria-label="Copy suggested caption">Copy caption</button>
          </div>
        </section>

        <section class="preview-panel" aria-label="Live badge preview">
          <div class="preview-kicker">Live preview</div>
          <div class="preview-stage">
            <div id="previewFrame" class="preview-frame" data-layout="square">
              <canvas id="badgeCanvas" role="img" aria-label="Badge preview"></canvas>
            </div>
          </div>
          <div class="contributor-id" id="contributorId">ID will appear here</div>
        </section>
      </div>
    </div>

    <script type="module" src="js/app.js?v=gold-preview"></script>
  </body>
</html>
